services:
  - type: web
    name: nutronics-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/nutronics.sqlite
      - key: UPLOADS_PATH
        value: /tmp/nutronics-uploads
      - key: CLIENT_ORIGIN
        value: https://nutronics.vercel.app
